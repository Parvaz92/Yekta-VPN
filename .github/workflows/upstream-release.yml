name: Auto-update Yekta VPN

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yekta-auto-update
  cancel-in-progress: false

jobs:
  update-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Yekta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with MSN-GUARD (exact upstream code + Yekta branding)
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/mbm110/MSN-GUARD.git master

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream update found."
            exit 0
          fi

          git merge --no-commit --no-ff -X theirs FETCH_HEAD || true

          # 1) Every file that exists upstream becomes EXACTLY the upstream file.
          #    No more half-old / half-new Kotlin or Gradle files.
          git checkout FETCH_HEAD -- .

          # Anything still unmerged was deleted upstream: drop it.
          for f in $(git diff --name-only --diff-filter=U); do
            git rm -q -f -- "$f" || true
          done

          # 2) Restore the files Yekta owns: workflows, website, docs, notices.
          for p in .github/workflows docs README.md README.en.md NOTICE.md; do
            if git cat-file -e "HEAD:$p" 2>/dev/null; then
              git rm -r -q -f --cached -- "$p" 2>/dev/null || true
              rm -rf -- "$p"
              git checkout HEAD -- "$p"
            fi
          done

          # 3) Yekta identity on top of upstream's own build file.
          sed -i 's/applicationId = "com.msnguard.vpn"/applicationId = "com.parvaz.vpn"/' app/build.gradle.kts
          grep -q 'applicationId = "com.parvaz.vpn"' app/build.gradle.kts
          if ! grep -q 'yektaRebrand' app/build.gradle.kts; then
          cat >> app/build.gradle.kts <<'KTS'

          val yektaRebrand = tasks.register<Exec>("yektaRebrand") {
              group = "build"
              description = "Applies Yekta VPN branding"
              onlyIf { !org.gradle.internal.os.OperatingSystem.current().isWindows }
              commandLine("bash", rootProject.file("tools/rebrand.sh").absolutePath)
          }
          tasks.named("preBuild").configure { dependsOn(yektaRebrand) }
          KTS
          fi

          git add -A
          git commit --no-edit -m "Sync MSN-GUARD update into Yekta VPN"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Same toolchain upstream uses, so its code always compiles here too.
      - name: Set up JDK 17
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up JDK 21
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: steps.sync.outputs.changed == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.3.11579264 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Install Rust and branding tools
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Prepare permanent signing key
        if: steps.sync.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHERY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          cat > keystore.env <<EOF2
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2

      - name: Build hev-socks5-tunnel (same as upstream)
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -e
          NDK="$ANDROID_HOME/ndk/26.3.11579264"
          if [ -d app/src/main/cpp/hev ]; then
            "$NDK/ndk-build" -C app/src/main/cpp/hev NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk -j"$(nproc)"
            for abi in arm64-v8a armeabi-v7a x86_64; do
              src="app/src/main/cpp/hev/libs/$abi/libhev-socks5-tunnel.so"
              dst="app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"
              if [ -f "$src" ]; then mkdir -p "app/src/main/jniLibs/$abi"; cp "$src" "$dst"; fi
            done
          fi

      - name: Build signed APKs
        if: steps.sync.outputs.changed == 'true'
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: 'false'
        run: |
          set -e
          chmod +x gradlew tools/rebrand.sh core/build-android.sh
          ./gradlew assembleRelease --no-daemon --stacktrace -PaetheryKeystore=release.keystore

      - name: Push synced code (only after a successful build)
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Publish automatic Release
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          tag="v${version}-$(date -u +%Y%m%d%H%M)"
          printf 'Yekta VPN automatic update.

Version: %s
' "$version" > release-notes.md
          gh release create "$tag" app/build/outputs/apk/release/*.apk --title "Yekta VPN ${tag}" --notes-file release-notes.md --latest
