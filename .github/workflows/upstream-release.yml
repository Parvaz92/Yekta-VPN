name: Auto-update Yekta VPN

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yekta-auto-update
  cancel-in-progress: false

jobs:
  update-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Yekta
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge MSN-GUARD updates (locally, not pushed yet)
        id: sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/mbm110/MSN-GUARD.git master

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream update found."
            exit 0
          fi

          git merge --no-commit --no-ff -X theirs FETCH_HEAD || true

          # Resolve any leftover conflicts in favour of upstream.
          for f in $(git diff --name-only --diff-filter=U); do
            if git checkout --theirs -- "$f" 2>/dev/null; then
              git add -- "$f"
            else
              git rm -q -f -- "$f" || true
            fi
          done

          # Keep Yekta-owned files exactly as they are on our master.
          for f in app/build.gradle.kts settings.gradle.kts core/build-android.sh; do
            git checkout HEAD -- "$f"
          done

          # Never take upstream workflow changes. GitHub refuses pushes that
          # touch .github/workflows from GITHUB_TOKEN, which is what broke
          # every run since Oct 9.
          git rm -r -q -f --cached .github/workflows || true
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows

          git add -A
          git commit --no-edit -m "Sync MSN-GUARD update into Yekta VPN"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.sync.outputs.changed == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.3.11579264 cmake;3.22.1"
          accept-android-sdk-licenses: true

      - name: Set up Rust
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Prepare permanent signing key
        if: steps.sync.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHERY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          cat > keystore.env <<EOF2
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF2

      - name: Build signed APKs
        if: steps.sync.outputs.changed == 'true'
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew tools/rebrand.sh core/build-android.sh
          echo "org.gradle.java.installations.auto-download=false" >> gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace -PaetheryKeystore=release.keystore
          git checkout -- gradle.properties

      - name: Push synced code (only after a successful build)
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Publish automatic Release
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          tag="v${version}-$(date -u +%Y%m%d%H%M)"
          printf 'Yekta VPN automatic update.\n\nVersion: %s\n' "$version" > release-notes.md
          gh release create "$tag" app/build/outputs/apk/release/*.apk --title "Yekta VPN ${tag}" --notes-file release-notes.md --latest
