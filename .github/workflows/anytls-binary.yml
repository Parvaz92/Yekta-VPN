name: AnyTLS binary

# Builds the anytls sidecar executable the SHARD transport needs for
# anytls:// nodes, for both shipping ABIs, and uploads it as an artifact.
# It is then pinned by run id in build.yml and copied into
# app/src/main/jniLibs/ there — exactly the arrangement the Tor and Xray
# binaries use, and for the same reasons:
#
#   libanytls.so  hardened anytls client (see anytls/README.md)
#
# Renamed to lib*.so because Android only grants the execute bit to files the
# APK packager recognises as native libraries. It is launched with
# ProcessBuilder, never dlopen'd — which is also why useLegacyPackaging must
# stay true.
#
# Source: the tree vendored under anytls/ (upstream anytls-go @ the commit
# in anytls/VENDORED_COMMIT + our hardened cmd/anytls-client). No network
# clone needed — the tree is in the repo, so the build is reproducible from
# the checkout alone. Upstream has no license file (see anytls/README.md
# "License" note); vendoring status is recorded there and must be resolved
# before any public release of the APK that carries this binary.

on:
  workflow_dispatch:
  push:
    paths:
      - 'anytls/**'
      - '.github/workflows/anytls-binary.yml'

jobs:
  anytls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.3.11579264'

      # Proves the vendored tree compiles and the hardened front end
      # actually speaks the protocol before any cross-compile: build for
      # the host and point it at a throwaway upstream server, also built
      # from the same tree. A curl through the tunnel is the pass line.
      # This is the same "prove it works, don't just link" discipline the
      # xray job applies with its config smoke test.
      - name: Host smoke test (protocol round trip)
        run: |
          set -euo pipefail
          cd anytls
          CGO_ENABLED=0 go build -trimpath -o /tmp/anytls-server ./cmd/server
          CGO_ENABLED=0 go build -trimpath -o /tmp/anytls-client ./cmd/anytls-client
          # reference server on a random port
          PORT=$((20000 + RANDOM % 20000))
          /tmp/anytls-server -l 127.0.0.1:$PORT -p cicheck > /tmp/anytls-server.log 2>&1 &
          SRV=$!
          sleep 1
          kill -0 $SRV
          /tmp/anytls-client -s "anytls://cicheck@127.0.0.1:$PORT/?insecure=1" -l 127.0.0.1:18080 > /tmp/anytls-client.log 2>&1 &
          CLI=$!
          sleep 1
          kill -0 $CLI
          CODE=$(curl -s --max-time 15 --socks5-hostname 127.0.0.1:18080 -o /dev/null -w '%{http_code}' https://cp.cloudflare.com/generate_204)
          kill $SRV $CLI 2>/dev/null || true
          echo "smoke: HTTP $CODE"
          [ "$CODE" = "204" ] || { echo "ERROR: tunnel did not carry a request"; exit 1; }

      - name: Build for both ABIs
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          set -euo pipefail
          trap 'rc=$?; echo "!!! FAILED rc=$rc line=$LINENO cmd: $BASH_COMMAND" >&2' ERR
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd anytls

          build() {
            local ABI="$1" GOARCH="$2" CC="$3"
            local OUT="../out/$ABI/libanytls.so"
            mkdir -p "$(dirname "$OUT")"
            echo "==> $ABI ($GOARCH)"
            # Same load-bearing flag set as the xray job (see that file for
            # the derivation): PIE, external linker, 16K max page size, no
            # common-page-size, strip.
            env GOOS=android GOARCH="$GOARCH" CGO_ENABLED=1 CC="$TOOLCHAIN/$CC" \
              go build -trimpath -buildmode=pie \
                -ldflags "-s -w -checklinkname=0 -extldflags '-Wl,-z,max-page-size=16384 -Wl,-z,relro -Wl,-z,now'" \
                -o "$OUT" ./cmd/anytls-client
            "$TOOLCHAIN/llvm-strip" --strip-unneeded "$OUT" || true
            ls -la "$OUT"
          }

          build arm64-v8a   arm64 aarch64-linux-android26-clang
          build armeabi-v7a arm   armv7a-linux-androideabi26-clang
          build x86_64      amd64 x86_64-linux-android26-clang

          echo "==> all ABIs built"
          ls -la ../out/*/libanytls.so

      # The same gates the Tor and Xray binaries pass: non-PIE will not
      # launch, 4K alignment fails on 16 KB-page devices, and a RELRO range
      # that overruns its LOAD makes bionic refuse the file outright.
      - name: Verify PIE, page alignment and RELRO
        env:
          NDK: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          set -euo pipefail
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          ls -la out/*/libanytls.so

          for f in out/*/libanytls.so; do
            echo "=== $f ==="
            hdr=$( "$READELF" -h "$f" )
            phdrs=$("$READELF" -lW "$f")
            printf '%s\n' "$phdrs" | grep -E '^ *(LOAD|GNU_RELRO)' || true

            TYPE=$(awk -F: '/^ *Type:/ {print $2}' <<< "$hdr" | awk '{print $1}')
            ALIGN=$(awk '$1 == "LOAD" && !seen {a = $NF; seen = 1} END {print a}' <<< "$phdrs")
            echo "parsed: type=[$TYPE] align=[$ALIGN] size=$(stat -c%s "$f")"

            [ "$TYPE" = "DYN" ] || { echo "ERROR: $f is not PIE (type=$TYPE)"; exit 1; }
            [ "$ALIGN" = "0x4000" ] || { echo "ERROR: $f align=$ALIGN, want 0x4000"; exit 1; }

            RELRO_VADDR=$(awk '$1=="GNU_RELRO" {print $3}' <<< "$phdrs")
            RELRO_MEMSZ=$(awk '$1=="GNU_RELRO" {print $6}' <<< "$phdrs")
            LOAD_MEMSZ=$(awk -v v="$RELRO_VADDR" '$1=="LOAD" && $3==v {print $6}' <<< "$phdrs")
            if [ -n "$RELRO_MEMSZ" ] && [ -n "$LOAD_MEMSZ" ]; then
              V=$((RELRO_VADDR)); R=$((RELRO_MEMSZ)); L=$((LOAD_MEMSZ))
              for P in 4096 16384; do
                REND=$(( ((V + R + P - 1) / P) * P ))
                LEND=$(( ((V + L + P - 1) / P) * P ))
                printf '  %6d-byte pages: mprotect end 0x%x, mapped end 0x%x' "$P" "$REND" "$LEND"
                if [ "$REND" -gt "$LEND" ]; then
                  echo " -> FAIL"
                  exit 1
                fi
                echo " -> OK"
              done
            fi
          done
          sha256sum out/*/libanytls.so

      - name: Upload libanytls.so
        uses: actions/upload-artifact@v4
        with:
          name: libanytls
          path: out/*/libanytls.so
          if-no-files-found: error
