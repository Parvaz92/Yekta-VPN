name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        # android-actions/setup-android@v3 died with the 2026-09-07 runner image:
        # it installs the legacy `tools` package, which Google has removed from
        # the repository, and sdkmanager exits 1 on the "Failed to find package"
        # warning. The runner image already ships the SDK and cmdline-tools 16;
        # accepting the licenses is all that is actually needed.
        # NDK 26.3.11579264 is required for Rust core build (matches gradle ndkVersion).
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --list_installed | head -10

      - name: Install Rust and targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup signing keystore
        env:
          AETHERY_KEYSTORE_BASE64: ${{ secrets.AETHERY_KEYSTORE_BASE64 }}
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          echo "$AETHERY_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.env <<EOF
          storePassword=$AETHERY_KEYSTORE_PASSWORD
          keyAlias=$AETHERY_KEY_ALIAS
          keyPassword=$AETHERY_KEY_PASSWORD
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PaetheryKeystore=release.keystore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk